name: Reconstruct final PDF report

on:
  push:
    branches: [main]
    paths:
      - 'BUILD_PDF_NOW'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct PDF
        shell: bash
        run: |
          cat .pdf_chunks/chunk_*.txt | base64 --decode > Relatorio_Final_Queimadas_Internacoes_Amazonas.pdf
          test -s Relatorio_Final_Queimadas_Internacoes_Amazonas.pdf
          file Relatorio_Final_Queimadas_Internacoes_Amazonas.pdf
      - name: Commit final report and clean temporary files
        shell: bash
        run: |
          rm -rf .pdf_chunks BUILD_PDF_NOW .github/workflows/reconstruct-report.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Adiciona relatório final em PDF'
          git push
