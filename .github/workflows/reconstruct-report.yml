name: Build final PDF report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'BUILD_PDF_NOW'
      - 'scripts/build_pdf_report.py'
      - 'data/processed/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install report dependencies
        run: pip install pandas matplotlib reportlab

      - name: Build final PDF
        run: python scripts/build_pdf_report.py

      - name: Commit generated report
        shell: bash
        run: |
          rm -f BUILD_PDF_NOW
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Relatorio_Final_Queimadas_Internacoes_Amazonas.pdf BUILD_PDF_NOW || true
          if git diff --cached --quiet; then
            echo 'No PDF changes to commit.'
          else
            git commit -m 'Atualiza relatório final em PDF'
            git push
          fi
